以下是您需要的“华语生字连线小游戏”的完整HTML代码。它是一款卡通风格的教育游戏，帮助小学生通过配对甲骨文与现代汉字来学习华语。
```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>甲骨文连连乐 - 华语生字连线小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f9f0c1 0%, #c8e7f5 100%);
            font-family: 'Comic Neue', 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI Emoji', 'Noto Sans CJK SC', cursive, sans-serif;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 主游戏容器 */
        .game-container {
            max-width: 1300px;
            width: 100%;
            background: rgba(255, 250, 235, 0.9);
            backdrop-filter: blur(3px);
            border-radius: 72px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.2), inset 0 2px 6px rgba(255,255,200,0.8);
            overflow: hidden;
            padding: 20px 24px 32px;
            transition: all 0.2s;
        }

        /* 头部区域 */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            background: #FFE4B5;
            border-radius: 60px;
            padding: 8px 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 0 #E2B87A;
        }
        .title-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .mascot {
            font-size: 3.2rem;
            filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.2));
            animation: bounceHappy 2s infinite;
            cursor: default;
        }
        h1 {
            font-size: 1.9rem;
            background: #FFB882;
            padding: 6px 20px;
            border-radius: 50px;
            color: white;
            text-shadow: 3px 3px 0 #C2682C;
            letter-spacing: 2px;
        }
        .music-btn {
            background: #FADB67;
            border: none;
            font-size: 1.7rem;
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #B97F10;
            transition: 0.05s linear;
            font-weight: bold;
        }
        .music-btn:active { transform: translateY(3px); box-shadow: none;}

        /* 关卡与开始区 */
        .level-start-panel {
            background: #FFF3E0;
            border-radius: 48px;
            padding: 16px 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .level-buttons {
            background: white;
            border-radius: 50px;
            padding: 5px 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .level-btn {
            background: #D9E8F5;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.1s;
        }
        .level-btn.active {
            background: #FFB347;
            color: white;
            box-shadow: 0 2px 10px orange;
        }
        .start-game-btn {
            background: #4caf50;
            border: none;
            font-size: 1.5rem;
            padding: 10px 32px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #2e6b2f;
        }
        .start-game-btn:active { transform: translateY(3px);}

        /* 统计栏 */
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            background: #FFF1DF;
            border-radius: 50px;
            padding: 10px 20px;
            margin: 15px 0;
            gap: 12px;
        }
        .stat-card {
            background: white;
            border-radius: 35px;
            padding: 5px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .progress-area {
            flex: 2;
            background: #EED9B1;
            border-radius: 40px;
            height: 22px;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #FF9F4A;
            border-radius: 40px;
            transition: width 0.2s;
        }

        /* 卡片网格 (连线配对: 甲骨文卡+现代字卡) */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }
        .card {
            background: #FFF9EF;
            aspect-ratio: 3 / 4;
            border-radius: 36px;
            box-shadow: 0 14px 0 #C5A16E;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: transform 0.15s, box-shadow 0.1s;
            padding: 12px 8px;
            border: 3px solid #FFDA88;
            position: relative;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 0 #C5A16E;
        }
        .card.selected {
            transform: translateY(4px);
            box-shadow: 0 6px 0 #C5A16E;
            border: 4px solid #FFA559;
            background: #FFF5E6;
        }
        .card.eliminated {
            visibility: hidden;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.7);
            transition: visibility 0.2s, opacity 0.2s;
        }
        .card-emoji {
            font-size: 3.2rem;
            margin-bottom: 8px;
        }
        .card-word {
            font-size: 1.5rem;
            font-weight: bold;
            background: #FFECC2;
            padding: 6px 12px;
            border-radius: 40px;
            margin: 8px 0 4px;
        }
        .sound-small {
            background: #C9E9DC;
            border: none;
            font-size: 0.9rem;
            margin-top: 6px;
            padding: 5px 14px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 浮动反馈 */
        .floating-feedback {
            position: fixed;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #FEE6A9;
            padding: 18px 32px;
            border-radius: 80px;
            font-size: 2rem;
            font-weight: bold;
            color: #D2691E;
            z-index: 200;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            animation: fadeFly 0.9s forwards;
            pointer-events: none;
        }
        @keyframes fadeFly {
            0% { opacity: 0; transform: translate(-50%, 20px);}
            20% { opacity: 1; transform: translate(-50%, -50%);}
            80% { opacity: 1;}
            100% { opacity: 0; transform: translate(-50%, -120px);}
        }
        .star-drop {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            animation: starFall 1s ease-out forwards;
            z-index: 150;
        }
        @keyframes starFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1;}
            100% { transform: translateY(100px) rotate(30deg); opacity: 0;}
        }

        /* 结束弹窗 */
        .end-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .end-card {
            background: #FFF6E5;
            border-radius: 68px;
            padding: 30px;
            text-align: center;
            max-width: 420px;
            border: 6px solid #FFC857;
        }
        .end-card button {
            background: #FFB347;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        @media (max-width: 700px) {
            .game-container { padding: 12px; }
            .card-word { font-size: 1.1rem; }
            .cards-grid { gap: 12px; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));}
            .stat-card { font-size: 0.9rem; }
            h1 { font-size: 1.3rem;}
        }
        @keyframes bounceHappy {
            0%,100%{ transform: translateY(0);}
            50%{ transform: translateY(-8px);}
        }
    </style>
</head>
<body>

<div class="game-container" id="gameApp">
    <div class="game-header">
        <div class="title-area">
            <div class="mascot">🐼 小墨</div>
            <h1>📜 甲骨文连连乐</h1>
        </div>
        <button class="music-btn" id="bgmBtn">🎵 开启音乐</button>
    </div>

    <div class="level-start-panel">
        <div class="level-buttons" id="levelGroup">
            <button data-level="0" class="level-btn active">🌱 入门篇</button>
            <button data-level="1" class="level-btn">🌟 进阶篇</button>
            <button data-level="2" class="level-btn">🏆 大师篇</button>
        </div>
        <button class="start-game-btn" id="startGameBtn">✨ 开始游戏 ✨</button>
    </div>

    <!-- 数据栏 -->
    <div class="stats-bar" id="statsPanel" style="display: none;">
        <div class="stat-card">⭐ 得分: <span id="scoreVal">0</span></div>
        <div class="stat-card">🔥 Combo: <span id="comboVal">0</span></div>
        <div class="stat-card">⏱️ 时间: <span id="timerVal">00</span>秒</div>
        <div class="progress-area"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <!-- 卡片网格 -->
    <div id="cardsGrid" class="cards-grid"></div>

    <!-- 提示栏 -->
    <div style="text-align: center; margin-top: 12px; background: #FFEBD6; border-radius: 40px; padding: 8px; font-size:1rem;" id="gameMsg">
        🧸 点击「开始游戏」，配对「甲骨文」和「现代汉字」吧！
    </div>
</div>

<script>
    // --------------------------- 词库（甲骨文 + 现代字 + 拼音/例句）--------------------------------
    const LEVELS = {
        0: { // 入门篇 6组基础字
            name: "入门篇",
            words: [
                { ancient: "🐚 𡿨", modern: "川", pinyin: "chuān", meaning: "河流", example: "山川美丽。", emoji: "🏞️" },
                { ancient: "🌞 ⊙", modern: "日", pinyin: "rì", meaning: "太阳", example: "日出东方。", emoji: "☀️" },
                { ancient: "🌙 )", modern: "月", pinyin: "yuè", meaning: "月亮", example: "月亮圆圆。", emoji: "🌙" },
                { ancient: "🔥 灬", modern: "火", pinyin: "huǒ", meaning: "火焰", example: "火苗温暖。", emoji: "🔥" },
                { ancient: "💧 〰", modern: "水", pinyin: "shuǐ", meaning: "流水", example: "喝水健康。", emoji: "💧" },
                { ancient: "🌳 木", modern: "木", pinyin: "mù", meaning: "树木", example: "木头玩具。", emoji: "🌳" }
            ]},
        1: { // 进阶篇 6组
            name: "进阶篇",
            words: [
                { ancient: "🐂 牛角", modern: "牛", pinyin: "niú", meaning: "牛", example: "黄牛耕地。", emoji: "🐮" },
                { ancient: "🐏 羊角", modern: "羊", pinyin: "yáng", meaning: "羊", example: "小羊咩咩。", emoji: "🐑" },
                { ancient: "🐦 鸟形", modern: "鸟", pinyin: "niǎo", meaning: "鸟类", example: "小鸟飞翔。", emoji: "🐦" },
                { ancient: "🌾 禾", modern: "禾", pinyin: "hé", meaning: "谷物", example: "禾苗生长。", emoji: "🌾" },
                { ancient: "🏠 宀", modern: "家", pinyin: "jiā", meaning: "家庭", example: "我爱我家。", emoji: "🏠" },
                { ancient: "👣 止", modern: "足", pinyin: "zú", meaning: "脚", example: "足迹深深。", emoji: "🦶" }
            ]},
        2: { // 大师篇 6组抽象/趣味
            name: "大师篇",
            words: [
                { ancient: "⚔️ 戈", modern: "武", pinyin: "wǔ", meaning: "武术", example: "文武双全。", emoji: "⚔️" },
                { ancient: "💗 心形", modern: "心", pinyin: "xīn", meaning: "心脏", example: "心情愉快。", emoji: "❤️" },
                { ancient: "👁️ 目", modern: "目", pinyin: "mù", meaning: "眼睛", example: "目瞪口呆。", emoji: "👁️" },
                { ancient: "✋ 手形", modern: "手", pinyin: "shǒu", meaning: "手", example: "双手捧花。", emoji: "✋" },
                { ancient: "👄 口", modern: "口", pinyin: "kǒu", meaning: "嘴巴", example: "人口众多。", emoji: "👄" },
                { ancient: "⛰️ 山", modern: "山", pinyin: "shān", meaning: "高山", example: "山水如画。", emoji: "⛰️" }
            ]}
    };

    // 全局变量
    let currentLevelId = 0;
    let currentCards = [];          // {id, pairId, type, ancientDisplay, modernWord, meaning, pinyin, example, emoji, eliminated}
    let selectedIndex = null;
    let score = 0;
    let combo = 0;
    let timeLeft = 55;              // 秒
    let timerInterval = null;
    let gameActive = false;
    let totalPairs = 6;
    let matchedPairsCount = 0;
    let bgmEnabled = true;
    let audioCtx = null;

    // DOM 元素
    const cardsGrid = document.getElementById('cardsGrid');
    const startBtn = document.getElementById('startGameBtn');
    const statsPanel = document.getElementById('statsPanel');
    const scoreSpan = document.getElementById('scoreVal');
    const comboSpan = document.getElementById('comboVal');
    const timerSpan = document.getElementById('timerVal');
    const progressFill = document.getElementById('progressFill');
    const gameMsg = document.getElementById('gameMsg');
    const bgmBtn = document.getElementById('bgmBtn');

    // 音效 (简洁Web Audio)
    function playSound(type) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let freq = 0;
            if(type === 'correct') freq = 880;
            else if(type === 'wrong') freq = 540;
            else if(type === 'win') freq = 1250;
            else return;
            osc.frequency.value = freq;
            gain.gain.value = 0.2;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
            osc.stop(audioCtx.currentTime + 0.3);
            if(type === 'win') {
                setTimeout(() => {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.connect(gain2); gain2.connect(audioCtx.destination);
                    osc2.frequency.value = 1000;
                    gain2.gain.value = 0.2;
                    osc2.start();
                    gain2.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                    osc2.stop(audioCtx.currentTime + 0.5);
                }, 120);
            }
        } catch(e) { console.log("audio init later"); }
    }

    // 浮动鼓励语
    function showEncouragement(msg) {
        const div = document.createElement('div');
        div.className = 'floating-feedback';
        div.innerText = msg;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 850);
    }

    // 星星掉落
    function dropStars(count = 3) {
        for(let i=0;i<count;i++) {
            const star = document.createElement('div');
            star.className = 'star-drop';
            star.innerHTML = '⭐';
            star.style.left = Math.random() * window.innerWidth + 'px';
            star.style.top = '25%';
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 1000);
        }
    }

    // 发音功能: 现代汉字 + 拼音例句
    function speakChinese(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.8;
        speechSynthesis.cancel();
        speechSynthesis.speak(utterance);
    }

    // 生成卡片 (每对: 甲骨文卡片 + 现代汉字卡片)
    function buildCards(levelId) {
        const wordsArray = LEVELS[levelId].words;
        let cards = [];
        let pairId = 0;
        for(let w of wordsArray) {
            // 甲骨文卡片
            cards.push({
                id: crypto.randomUUID ? crypto.randomUUID() : Math.random(),
                pairId: pairId,
                type: 'ancient',
                displayMain: w.ancient,
                displayWord: w.ancient,
                meaning: w.meaning,
                pinyin: w.pinyin,
                example: w.example,
                emoji: w.emoji,
                modernWord: w.modern,
                eliminated: false
            });
            // 现代字卡片
            cards.push({
                id: crypto.randomUUID ? crypto.randomUUID() : Math.random(),
                pairId: pairId,
                type: 'modern',
                displayMain: w.modern,
                displayWord: w.modern,
                meaning: w.meaning,
                pinyin: w.pinyin,
                example: w.example,
                emoji: w.emoji,
                modernWord: w.modern,
                eliminated: false
            });
            pairId++;
        }
        // Fisher-Yates 洗牌
        for(let i=cards.length-1;i>0;i--) {
            const j = Math.floor(Math.random()*(i+1));
            [cards[i], cards[j]] = [cards[j], cards[i]];
        }
        return cards;
    }

    // 刷新UI
    function renderGrid() {
        if(!cardsGrid) return;
        cardsGrid.innerHTML = '';
        currentCards.forEach((card, idx) => {
            if(card.eliminated) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'card eliminated';
                cardsGrid.appendChild(emptyDiv);
                return;
            }
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            if(selectedIndex === idx) cardDiv.classList.add('selected');
            let mainContent = card.type === 'ancient' ? `📜 ${card.displayMain}` : `${card.displayWord}`;
            let subHint = card.type === 'ancient' ? '甲骨文' : '现代字';
            cardDiv.innerHTML = `
                <div class="card-emoji">${card.emoji || (card.type==='ancient'?'🐉':'📖')}</div>
                <div class="card-word">${card.displayWord}</div>
                <div style="font-size:0.8rem; background:#FDE2B3; padding:2px 8px; border-radius:20px;">${subHint}</div>
                <button class="sound-small">🔊 听读音/例句</button>
            `;
            const soundBtn = cardDiv.querySelector('.sound-small');
            soundBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                // 教学例句: 读出现代字+例句
                const sentence = `${card.modernWord}：${card.example}`;
                speakChinese(sentence);
                playSound('correct');
            });
            cardDiv.addEventListener('click', () => onCardClick(idx));
            cardsGrid.appendChild(cardDiv);
        });
        scoreSpan.innerText = score;
        comboSpan.innerText = combo;
        let matched = currentCards.filter(c => c.eliminated).length / 2;
        let percent = (matched / totalPairs) * 100;
        progressFill.style.width = percent + '%';
    }

    // 配对逻辑
    function onCardClick(clickIdx) {
        if(!gameActive) return;
        const clicked = currentCards[clickIdx];
        if(clicked.eliminated) return;
        if(selectedIndex !== null) {
            const firstCard = currentCards[selectedIndex];
            if(selectedIndex === clickIdx) {
                selectedIndex = null;
                renderGrid();
                return;
            }
            // 检查是否匹配 (甲骨文 ↔ 现代字同一个pairId)
            if(firstCard.pairId === clicked.pairId && firstCard.type !== clicked.type) {
                // 正确配对
                playSound('correct');
                combo++;
                let addPoints = 10 + Math.floor(combo/3)*2;
                score += addPoints;
                currentCards[selectedIndex].eliminated = true;
                currentCards[clickIdx].eliminated = true;
                matchedPairsCount++;
                selectedIndex = null;
                const praises = ['很好！', '非常棒！', '优秀！', '好厉害！', '继续加油✨'];
                const randomMsg = praises[Math.floor(Math.random()*praises.length)];
                showEncouragement(randomMsg);
                dropStars(2);
                gameMsg.innerText = `✔️ 配对成功！「${firstCard.displayWord}」↔「${clicked.displayWord}」 例句：${firstCard.example}`;
                setTimeout(()=>{if(gameActive) gameMsg.innerText = "🧩 继续配对，成为汉字小英雄！";}, 2200);
                renderGrid();
                // 检查胜利
                const allMatched = currentCards.every(c => c.eliminated === true);
                if(allMatched) {
                    gameWin();
                }
            } else {
                // 错误配对
                playSound('wrong');
                combo = 0;
                showEncouragement('再接再厉 🤗');
                gameMsg.innerText = `❌ 配对错误，「${firstCard.displayWord}」 和 「${clicked.displayWord}」不匹配。再试试看！`;
                setTimeout(()=>{if(gameActive) gameMsg.innerText = "📖 观察字形，把甲骨文和现代汉字连起来吧～";}, 1800);
                selectedIndex = null;
                renderGrid();
            }
        } else {
            selectedIndex = clickIdx;
            renderGrid();
        }
    }

    // 计时器
    function startTimer() {
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if(!gameActive) return;
            if(timeLeft <= 0) {
                clearInterval(timerInterval);
                gameActive = false;
                gameMsg.innerText = "⏰ 时间用完了！点击「开始游戏」重新挑战吧。";
                showEndGame(false);
            } else {
                timeLeft--;
                timerSpan.innerText = timeLeft;
                if(timeLeft <= 8) timerSpan.style.color = "red";
                else timerSpan.style.color = "black";
            }
        }, 1000);
    }

    function gameWin() {
        if(!gameActive) return;
        gameActive = false;
        clearInterval(timerInterval);
        playSound('win');
        let starsEarned = Math.min(3, Math.floor(timeLeft / 12) + 1);
        if(starsEarned < 0) starsEarned = 1;
        showEncouragement('🎉 通关啦 🎉');
        dropStars(6);
        gameMsg.innerText = `🏆 胜利！得分 ${score}，获得 ${'⭐'.repeat(starsEarned)} 颗星！`;
        showEndGame(true, starsEarned);
    }

    function showEndGame(isWin, stars = 0) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'end-modal';
        const learned = matchedPairsCount;
        let starDisplay = '';
        if(isWin) starDisplay = '⭐'.repeat(stars);
        else starDisplay = '无';
        modalDiv.innerHTML = `
            <div class="end-card">
                <h2>${isWin ? "🎉 游戏胜利 🎉" : "⏰ 游戏结束"}</h2>
                <p>⭐ 最终得分: ${score}</p>
                <p>🌟 获得星星: ${starDisplay}</p>
                <p>📖 学习新字: ${learned * 2} 个生字</p>
                <button id="restartGameBtn">🐣 再玩一次</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        document.getElementById('restartGameBtn').addEventListener('click', () => {
            modalDiv.remove();
            resetAndStart();
        });
    }

    function resetAndStart() {
        if(timerInterval) clearInterval(timerInterval);
        gameActive = true;
        selectedIndex = null;
        currentCards = buildCards(currentLevelId);
        matchedPairsCount = 0;
        score = 0;
        combo = 0;
        timeLeft = 55;
        timerSpan.innerText = timeLeft;
        timerSpan.style.color = "black";
        renderGrid();
        startTimer();
        gameMsg.innerText = `🎋 当前关卡: ${LEVELS[currentLevelId].name}，配对甲骨文与现代字吧！🎋`;
        statsPanel.style.display = 'flex';
    }

    // 切换主题 (未开始时)
    function setLevel(levelId) {
        if(gameActive) {
            gameMsg.innerText = "请先完成本局或点击「开始游戏」重置哦！";
            return;
        }
        currentLevelId = levelId;
        document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.level-btn[data-level="${levelId}"]`).classList.add('active');
        currentCards = buildCards(levelId);
        renderGrid();
        gameMsg.innerText = `✅ 已选择「${LEVELS[levelId].name}」，点击「开始游戏」挑战！`;
        statsPanel.style.display = 'none';
    }

    // 背景音乐模拟
    bgmBtn.addEventListener('click', () => {
        bgmEnabled = !bgmEnabled;
        bgmBtn.innerText = bgmEnabled ? "🎵 开启音乐" : "🔇 关闭音乐";
        if(bgmEnabled && audioCtx) {
            audioCtx.resume();
            playSound('correct');  // 轻提示音表示开启
        }
    });

    // 初始化
    function init() {
        setLevel(0);
        startBtn.addEventListener('click', () => {
            resetAndStart();
        });
        document.querySelectorAll('.level-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const lvl = parseInt(btn.dataset.level);
                setLevel(lvl);
            });
        });
        // 全局点击激活音频上下文
        document.body.addEventListener('click', () => {
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        });
        renderGrid();
    }

    init();
</script>
</body>
</html>
